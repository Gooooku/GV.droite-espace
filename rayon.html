<style>
:root{ --ink:#fff; --muted:#d9cde6; --glass:rgba(22,12,32,.62); --stroke:rgba(255,255,255,.16);
  --H:#ffc24a; --d:#ff8a3d; --t:#c7a6ff; --E:#6dff94; --miss:#ff6b6b; --hit:#6dff94; color-scheme:dark; }
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --glass:rgba(22,12,32,.58); } }
:root[data-theme="light"]{ --glass:rgba(22,12,32,.58); }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:#2a1838; color:var(--ink); overflow:hidden; font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; }
.m{ font-family:"STIX Two Text","Cambria Math","Times New Roman",serif; font-style:italic; font-weight:500; }
.vec{ position:relative; display:inline-block; }
.vec::after{ content:"→"; position:absolute; left:52%; top:-.58em; transform:translateX(-50%); font-size:.72em; font-style:normal; line-height:1; }
.cH{ color:var(--H); } .cd{ color:var(--d); } .ct{ color:var(--t); } .cE{ color:var(--E); } .cMiss{ color:var(--miss); } .cHit{ color:var(--hit); }
.stage{ position:relative; width:100%; height:100%; overflow:hidden; touch-action:none; --u:min(1vw, 1.78vh); }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#labels{ position:absolute; inset:0; pointer-events:none; }
.lb{ position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:calc(var(--u)*1.7); white-space:nowrap; text-shadow:0 0 3px #1a1022, 0 0 7px #1a1022, 0 0 12px rgba(26,16,34,.8); }
.lb.ax{ font-size:calc(var(--u)*1.9); color:#fff; }
.lb.tick{ font-size:calc(var(--u)*1.1); font-weight:600; color:#f1e4f7; opacity:.85; }
.lb .coord{ font-size:.9em; }
.glass{ background:var(--glass); border:1px solid var(--stroke); box-shadow:0 10px 30px rgba(0,0,0,.25); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); }
.title{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; }
.title .box{ padding:calc(var(--u)*3) calc(var(--u)*5); border-radius:calc(var(--u)*2.4); }
.title p{ margin:0 0 calc(var(--u)*1); font-size:calc(var(--u)*2.2); color:var(--muted); font-weight:600; }
.title h1{ margin:0; font-weight:800; font-size:calc(var(--u)*5); letter-spacing:-.02em; line-height:1.05; }
.caption{ position:absolute; left:calc(var(--u)*3.5); top:calc(var(--u)*3); max-width:min(46%, 30em); pointer-events:none;
  padding:calc(var(--u)*1.5) calc(var(--u)*2.2); border-radius:calc(var(--u)*1.6); font-size:calc(var(--u)*2.1); font-weight:700; line-height:1.25; }
.caption > span{ display:block; }
.card{ position:absolute; right:calc(var(--u)*3); top:calc(var(--u)*3 + 50px); width:21em; padding:calc(var(--u)*1.4) calc(var(--u)*1.8);
  border-radius:calc(var(--u)*1.8); font-size:calc(var(--u)*1.5); }
.blk + .blk{ margin-top:calc(var(--u)*1.3); padding-top:calc(var(--u)*1.3); border-top:1px solid var(--stroke); }
.blk h2{ margin:0 0 .45em; font-size:1em; font-weight:800; display:flex; align-items:center; gap:.5em; }
.blk h2 i{ width:.8em; height:.8em; border-radius:50%; display:inline-block; }
.data{ display:flex; gap:.3em 1.3em; flex-wrap:wrap; font-size:1.05em; }
.data > div{ white-space:nowrap; }
.eq{ overflow:hidden; }
.sys{ margin-top:.55em; border-left:2px solid var(--muted); border-radius:12px 0 0 12px; padding:.1em 0 .1em .7em; display:grid; gap:.12em; font-size:1.12em; }
.test{ margin-top:.55em; display:grid; gap:.25em; font-size:1.02em; font-variant-numeric:tabular-nums; }
.test div{ white-space:nowrap; display:grid; grid-template-columns:1.6em 1fr auto; align-items:baseline; }
.test .res{ font-weight:800; min-width:3.2em; text-align:right; }
.verdict{ margin-top:.55em; font-weight:800; min-height:1.3em; white-space:nowrap; }
.ctrl{ position:absolute; right:calc(var(--u)*3); top:calc(var(--u)*3); display:flex; gap:8px; }
.ctrl button{ font:inherit; font-weight:700; font-size:14px; padding:9px 15px; border-radius:99px; color:#fff; cursor:pointer; }
.ctrl button:focus-visible{ outline:3px solid var(--H); outline-offset:2px; }
.seek{ position:absolute; left:0; right:0; bottom:0; padding:28px calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*3.5); display:flex; align-items:center; gap:14px; transition:opacity .25s; }
.seek input{ flex:1; accent-color:var(--H); height:22px; cursor:pointer; }
.seek span{ font-size:14px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; min-width:6.5em; text-align:right; text-shadow:0 0 6px #000; }
@media (hover: hover){ .seek{ opacity:0; } .seek:hover, .seek:has(input:focus-visible), .seek.drag{ opacity:1; } }
#flash{ position:absolute; inset:0; background:#fff6d8; opacity:0; pointer-events:none; }
@media (max-aspect-ratio: 1/1){
  .stage{ --u:min(1.9vw, 1.2vh); }
  .card{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); width:auto; top:calc(var(--u)*2.5); font-size:calc(var(--u)*1.5); padding:calc(var(--u)*1.2) calc(var(--u)*1.6); }
  .blk + .blk{ margin-top:calc(var(--u)*1); padding-top:calc(var(--u)*1); }
  .ctrl{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:auto; bottom:calc(var(--u)*2 + 36px); flex-wrap:wrap; gap:6px; }
  .ctrl button{ padding:7px 11px; font-size:13px; }
  .caption{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); max-width:none; top:auto; bottom:calc(var(--u)*2 + 128px); font-size:calc(var(--u)*2.5); }
  .seek{ padding:10px calc(var(--u)*3) calc(var(--u)*2); }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Animation 3D : un guerrier lance un rayon d'énergie, on vérifie par le calcul s'il touche l'ennemi"></canvas>
  <div id="labels"></div>
  <div id="flash"></div>
  <div class="title" id="title"><div class="box glass"><p>Application</p><h1>Le rayon va-t-il toucher&nbsp;?</h1></div></div>
  <div class="card glass" id="card" style="opacity:0">
    <div class="blk">
      <h2><i style="background:var(--H)"></i>Le rayon</h2>
      <div class="data"><div id="dH"><span class="m cH">H</span><span class="cH">(1 ; 1 ; 1,5)</span></div><div id="dd"><span class="m cd vec">d</span> = <span class="cd">(3 ; 2 ; 0,5)</span></div></div>
      <div class="eq" id="eqR"><div class="sys">
        <div id="R0"><span class="m">x</span> = <span class="cH">1</span> + <span class="cd">3</span><span class="m ct">t</span></div>
        <div id="R1"><span class="m">y</span> = <span class="cH">1</span> + <span class="cd">2</span><span class="m ct">t</span></div>
        <div id="R2"><span class="m">z</span> = <span class="cH">1,5</span> + <span class="cd">0,5</span><span class="m ct">t</span></div>
      </div></div>
    </div>
    <div class="blk" id="blkE">
      <h2><i style="background:var(--E)"></i>La cible</h2>
      <div class="data"><div id="dE"></div></div>
      <div class="test" id="test">
        <div id="T0"><span class="m">x</span><span id="T0e"></span><span class="res" id="T0r"></span></div>
        <div id="T1"><span class="m">y</span><span id="T1e"></span><span class="res" id="T1r"></span></div>
        <div id="T2"><span class="m">z</span><span id="T2e"></span><span class="res" id="T2r"></span></div>
      </div>
      <div class="verdict" id="verdict">&nbsp;</div>
    </div>
  </div>
  <div class="caption glass" id="caption" style="opacity:0"><span id="captxt"></span></div>
  <div class="ctrl"><button class="glass" id="rot" aria-pressed="false">Rotation auto : non</button><button class="glass" id="voice" aria-pressed="false">Activer la voix</button><button class="glass" id="sound" aria-pressed="false">Activer le son</button><button class="glass" id="pause">Pause</button><button class="glass" id="replay">Rejouer</button></div>
  <div class="seek"><input type="range" id="seek" min="0" max="66" step="0.1" value="0" aria-label="Position dans l'animation"><span id="clock">0:00 / 1:06</span></div>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
(function(){
  const REC = /[?&]record/.test(location.search);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  const sine = x => -(Math.cos(Math.PI*x)-1)/2;
  const lerp = (a,b,k) => a + (b-a)*k;
  const rnd = (() => { let x = 424242; return () => ((x = (x*16807) % 2147483647) / 2147483647); })();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const M = (x,y,z) => new THREE.Vector3(x, z, -y);
  const Mv = a => M(a[0],a[1],a[2]);

  const stage = $('stage'), canvas = $('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:REC});
  renderer.setPixelRatio(REC ? 1 : Math.min(devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 16/9, 0.1, 600);
  // ---------- ciel de crépuscule ----------
  const sky = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 512; const x = c.getContext('2d'), g = x.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#1d1233'); g.addColorStop(.35,'#4b2a6b'); g.addColorStop(.58,'#c4506a'); g.addColorStop(.72,'#ff9a5a'); g.addColorStop(.8,'#ffd28a'); g.addColorStop(1,'#ffd28a');
    x.fillStyle = g; x.fillRect(0,0,16,512); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; })();
  const skyM = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.MeshBasicMaterial({map:sky, side:THREE.BackSide, fog:false}));
  scene.add(skyM);
  scene.fog = new THREE.Fog('#c46a62', 50, 240);

  // ---------- matériaux cel-shading ----------
  const grad = (() => { const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();
  const toon = (color, extra) => new THREE.MeshToonMaterial(Object.assign({color, gradientMap:grad}, extra||{}));
  const lineMat = new THREE.MeshBasicMaterial({color:'#17111f', side:THREE.BackSide});
  function part(parent, geo, mat, pos, opts){ opts = opts || {};
    const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(pos[0], pos[1], pos[2]);
    if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]); if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
    m.castShadow = true; parent.add(m);
    if (opts.line !== false){ const o = new THREE.Mesh(geo, lineMat); o.scale.setScalar(opts.line || 1.07); m.add(o); }
    return m; }
  function limb(parent, len, r0, r1, mat, pos){ const g = new THREE.Group(); if (pos) g.position.set(pos[0], pos[1], pos[2]); parent.add(g);
    const geo = new THREE.CylinderGeometry(r1, r0, len, 16); geo.translate(0, -len/2, 0);
    part(g, geo, mat, null, {line:1.08}); part(g, new THREE.SphereGeometry(r0*1.02, 16, 12), mat, [0,0,0], {line:1.08}); return g; }

  // ---------- le guerrier (design original) ----------
  function buildHero(){
    const skin = toon('#f1c8a4'), suit = toon('#1f2330'), vest = toon('#c9322f'), gold = toon('#f2b43a'), white = toon('#f4f4f6'), hairM = toon('#e9eef6'), tip = toon('#3fd0c9'), boot = toon('#3a2a22');
    const root = new THREE.Group(), pelvis = new THREE.Group(); pelvis.position.y = .98; root.add(pelvis);
    part(pelvis, new THREE.SphereGeometry(.2, 20, 14), suit, [0,0,0], {scale:[1.1,.8,.85]});
    const torso = new THREE.Group(); pelvis.add(torso);
    part(torso, new THREE.CylinderGeometry(.24, .19, .5, 20), vest, [0,.3,0], {scale:[1,1,.78]});
    part(torso, new THREE.SphereGeometry(.24, 20, 14, 0, Math.PI*2, 0, Math.PI/2), vest, [0,.55,0], {scale:[1.05,.55,.8]});
    part(torso, new THREE.TorusGeometry(.2, .035, 10, 28), gold, [0,.07,0], {rot:[Math.PI/2,0,0], scale:[1,.82,1]});
    part(torso, new THREE.BoxGeometry(.08, .34, .02), suit, [0,.33,.15], {line:1.15});
    const neck = part(torso, new THREE.CylinderGeometry(.07, .08, .1, 12), skin, [0,.66,0]);
    const head = new THREE.Group(); head.position.y = .82; torso.add(head);
    part(head, new THREE.SphereGeometry(.16, 24, 18), skin, [0,0,0], {scale:[.95,1.08,1]});
    part(head, new THREE.SphereGeometry(.07, 12, 10), skin, [0,-.09,.05], {scale:[1.3,.8,1], line:false});
    [-1,1].forEach(s => {
      part(head, new THREE.SphereGeometry(.028, 12, 10), white, [s*.058, .01, .138], {scale:[1,1.25,.5], line:1.2});
      part(head, new THREE.SphereGeometry(.015, 10, 8), toon('#1d1a2a'), [s*.056, .005, .15], {scale:[1,1.3,.5], line:false});
      part(head, new THREE.BoxGeometry(.06, .013, .01), toon('#1d1a2a'), [s*.058, .05, .15], {rot:[0,0,s*-.3], line:false});
      part(head, new THREE.SphereGeometry(.03, 10, 8), skin, [s*.155, 0, 0], {scale:[.5,1,.8]});
    });
    part(head, new THREE.BoxGeometry(.05, .008, .01), toon('#7a3b33'), [0,-.075,.148], {line:false});
    part(head, new THREE.TorusGeometry(.158, .02, 8, 32), white, [0,.06,0], {rot:[Math.PI/2 - .12, 0, 0]});
    [[-.04, .05], [.05, -.03]].forEach(([dx, dz], i) => part(head, new THREE.BoxGeometry(.03, .3, .012), white, [dx, -.06, -.17], {rot:[.35 + i*.15, 0, dz]}));
    // cheveux en pointes, balayés vers l'arrière
    const spikes = [[0,.14,.06, -.5,0,0,.2],[.08,.12,.02,-.9,0,-.6,.22],[-.08,.12,.02,-.9,0,.6,.22],[0,.1,-.08,-1.9,0,0,.3],[.1,.06,-.06,-2.2,0,-.9,.26],
      [-.1,.06,-.06,-2.2,0,.9,.26],[.05,.14,-.03,-1.3,0,-.3,.28],[-.05,.14,-.03,-1.3,0,.3,.28],[0,.02,-.13,-2.6,0,0,.24],[.12,-.02,-.02,-2.4,0,-1.3,.18],[-.12,-.02,-.02,-2.4,0,1.3,.18]];
    spikes.forEach(([x,y,z,rx,ry,rz,h]) => { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); head.add(g);
      const c = new THREE.ConeGeometry(.075, h, 8); c.translate(0, h/2, 0); part(g, c, hairM, [0,0,0], {line:1.1});
      const t2 = new THREE.ConeGeometry(.033, h*.35, 8); t2.translate(0, h*.175, 0); part(g, t2, tip, [0, h*.66, 0], {line:false}); });
    const arms = [-1,1].map(s => { const sh = limb(torso, .3, .075, .065, suit, [s*.29,.55,0]);
      part(sh, new THREE.SphereGeometry(.11, 14, 10), vest, [s*.02,.02,0], {scale:[1.1,.8,1]});
      const el = limb(sh, .27, .06, .05, skin, [0,-.3,0]); el.position.y = -.3;
      part(el, new THREE.TorusGeometry(.058, .026, 8, 20), gold, [0,-.2,0], {rot:[Math.PI/2,0,0]});
      const hand = part(el, new THREE.SphereGeometry(.06, 14, 10), skin, [0,-.31,0], {scale:[.85,1.1,.6]}); return {sh, el, hand}; });
    const legs = [-1,1].map(s => { const hip = limb(pelvis, .45, .1, .08, suit, [s*.11,-.05,0]);
      const kn = limb(hip, .43, .075, .06, suit, [0,-.45,0]);
      part(kn, new THREE.CylinderGeometry(.085, .07, .2, 14), boot, [0,-.34,0]);
      part(kn, new THREE.BoxGeometry(.13, .08, .26), boot, [0,-.45,.05]); return {hip, kn}; });
    return {root, pelvis, torso, head, arms, legs};
  }

  // ---------- l'adversaire (design original) ----------
  function buildRival(){
    const armor = toon('#2b2f3d'), plate = toon('#454b5e'), skin = toon('#7b8a9a'), glow = new THREE.MeshBasicMaterial({color:'#62ff8a'}), capeM = toon('#5b1830', {side:THREE.DoubleSide}), horn = toon('#d9d2c2');
    const root = new THREE.Group(), pelvis = new THREE.Group(); pelvis.position.y = 1.05; root.add(pelvis);
    part(pelvis, new THREE.SphereGeometry(.21, 20, 14), armor, [0,0,0], {scale:[1.05,.8,.85]});
    const torso = new THREE.Group(); pelvis.add(torso);
    part(torso, new THREE.CylinderGeometry(.27, .18, .56, 6), plate, [0,.32,0], {scale:[1,1,.75]});
    part(torso, new THREE.BoxGeometry(.3, .03, .02), glow, [0,.4,.19], {line:false}); part(torso, new THREE.BoxGeometry(.03, .28, .02), glow, [0,.26,.17], {line:false});
    [-1,1].forEach(s => { const sp = part(torso, new THREE.ConeGeometry(.13, .3, 5), plate, [s*.32,.62,0], {rot:[0,0,-s*.9]}); });
    const head = new THREE.Group(); head.position.y = .82; torso.add(head);
    part(head, new THREE.SphereGeometry(.15, 20, 16), armor, [0,0,0], {scale:[.92,1.12,1]});
    part(head, new THREE.BoxGeometry(.2, .05, .06), armor, [0,-.02,.12], {line:1.15});
    [-1,1].forEach(s => { part(head, new THREE.BoxGeometry(.055, .014, .01), glow, [s*.05,.02,.152], {rot:[0,0,s*.35], line:false});
      const h = new THREE.Group(); h.position.set(s*.1,.1,0); h.rotation.z = -s*.5; head.add(h);
      const c1 = new THREE.ConeGeometry(.045, .28, 8); c1.translate(0,.14,0); const m1 = part(h, c1, horn, [0,0,0], {line:1.12}); m1.rotation.x = -.5; });
    // cape
    const cg = new THREE.PlaneGeometry(.8, 1.5, 8, 14); cg.translate(0, -.75, 0);
    const cape = part(torso, cg, capeM, [0,.62,-.2], {line:false}); cape.userData.base = cg.attributes.position.array.slice();
    const arms = [-1,1].map(s => { const sh = limb(torso, .32, .08, .07, armor, [s*.31,.55,0]);
      const el = limb(sh, .28, .065, .055, skin, [0,-.32,0]); el.position.y = -.32;
      part(el, new THREE.CylinderGeometry(.075, .07, .14, 6), plate, [0,-.16,0]);
      const hand = part(el, new THREE.SphereGeometry(.058, 14, 10), skin, [0,-.31,0], {scale:[.85,1.1,.6]}); return {sh, el, hand}; });
    const legs = [-1,1].map(s => { const hip = limb(pelvis, .46, .1, .08, armor, [s*.11,-.05,0]);
      const kn = limb(hip, .45, .075, .06, armor, [0,-.46,0]); part(kn, new THREE.ConeGeometry(.09, .22, 6), plate, [0,-.4,.02], {rot:[Math.PI,0,0]}); return {hip, kn}; });
    return {root, pelvis, torso, head, arms, legs, cape};
  }


  const hero = buildHero(), rival = buildRival();
  scene.add(hero.root, rival.root);
  // poses (angles en radians)
  const P = {
    idle:   {sx:[.15,.15], sz:[-.25,.25], el:[-.35,-.35], hz:[.12,-.12], hx:[0,0], kn:[.05,.05], tx:0, ty:0, py:0},
    charge: {sx:[-.55,-.55], sz:[.55,-.55], el:[-1.9,-1.9], hz:[.38,-.38], hx:[-.25,.15], kn:[.55,.45], tx:.12, ty:.25, py:-.14},
    fire:   {sx:[-1.52,-1.52], sz:[.2,-.2], el:[-.08,-.08], hz:[.35,-.35], hx:[-.45,.35], kn:[.35,.55], tx:-.2, ty:0, py:-.1}
  };
  function mix(a, b, k){ const o = {}; for (const key in a){ o[key] = Array.isArray(a[key]) ? a[key].map((v,i) => lerp(v, b[key][i], k)) : lerp(a[key], b[key], k); } return o; }
  function applyPose(ch, p){
    ch.arms.forEach((a,i) => { a.sh.rotation.set(p.sx[i], 0, p.sz[i]); a.el.rotation.set(p.el[i], 0, 0); });
    ch.legs.forEach((l,i) => { l.hip.rotation.set(p.hx[i], 0, p.hz[i]); l.kn.rotation.set(p.kn[i], 0, 0); });

  document.addEventListener('keydown', e => { if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return; if (e.target === seekEl && e.key.startsWith('Arrow')) return;
    if (e.key === ' '){ e.preventDefault(); pauseBtn.click(); } else if (e.key === 'ArrowLeft') jump(T - 5); else if (e.key === 'ArrowRight') jump(T + 5); });
  function loop(now){
    const dt = Math.min(.1, (now-last)/1000); last = now; const prevT = T;
    if (ROT.on) ROT.clock += dt;
    if (playing){ T = holdForVoice(prevT, Math.min(END, T + dt)); if (T >= END){ playing = false; pauseBtn.textContent = 'Lecture'; } }
    if (skipAudio) skipAudio = false; else { audioTick(prevT, T); voiceTick(prevT, T); }
    audioFrame(T);
    if (!dragging) seekEl.value = T.toFixed(1); clockEl.textContent = mmss(T) + ' / ' + mmss(END);
    renderAt(Math.max(0, T)); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
