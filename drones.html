<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<link rel="apple-touch-icon" href="icone.svg">
<meta name="theme-color" content="#120e1b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partie 3 : Application — deux drones (avec voix)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=STIX+Two+Text:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202e; --muted:#4f5a6c; --glass:rgba(255,255,255,.5); --stroke:rgba(22,32,46,.12); --shadow:0 10px 30px rgba(22,32,46,.12);
  --R:#d9302c; --Rv:#e8740c; --Bl:#1f5fd6; --Bv:#0f9bb0; --t:#7a3cf0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef2fb; --muted:#b8c1d2; --glass:rgba(20,26,38,.5); --stroke:rgba(255,255,255,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
    --R:#ff5a52; --Rv:#ff9a3d; --Bl:#5b93ff; --Bv:#3fd2e6; --t:#b48cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eef2fb; --muted:#b8c1d2; --glass:rgba(20,26,38,.5); --stroke:rgba(255,255,255,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  --R:#ff5a52; --Rv:#ff9a3d; --Bl:#5b93ff; --Bv:#3fd2e6; --t:#b48cff;
  color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:#e9edf1; color:var(--ink); overflow:hidden; font-family:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; }
.m{ font-family:"STIX Two Text","Cambria Math","Times New Roman",serif; font-style:italic; font-weight:500; }
.vec{ position:relative; display:inline-block; }
.vec::after{ content:"→"; position:absolute; left:52%; top:-.58em; transform:translateX(-50%); font-size:.72em; font-style:normal; line-height:1; }
.cR{ color:var(--R); } .cRv{ color:var(--Rv); } .cB{ color:var(--Bl); } .cBv{ color:var(--Bv); } .ct{ color:var(--t); }

.stage{ position:relative; width:100%; height:100%; overflow:hidden; touch-action:none; --u:min(1vw, 1.78vh); }
canvas{ position:absolute; inset:0; display:block; width:100%; height:100%; }
#labels{ position:absolute; inset:0; pointer-events:none; }
.lb{ position:absolute; transform:translate(-50%,-50%); font-weight:700; font-size:calc(var(--u)*1.7); white-space:nowrap; color:#16202e;
  text-shadow:0 0 3px #fff, 0 0 6px #fff, 0 0 10px rgba(255,255,255,.8); }
.lb.ax{ font-size:calc(var(--u)*1.9); color:#3b4250; }
.lb.tick{ font-size:calc(var(--u)*1.1); font-weight:600; color:#6b7483; }
.lb .coord{ font-weight:700; font-size:.9em; }

.glass{ background:var(--glass); border:1px solid var(--stroke); box-shadow:var(--shadow); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); }
.title{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none; }
.title .box{ padding:calc(var(--u)*3) calc(var(--u)*5); border-radius:calc(var(--u)*2.4); }
.title p{ margin:0 0 calc(var(--u)*1); font-size:calc(var(--u)*2.2); color:var(--muted); font-weight:600; }
.title h1{ margin:0; font-weight:800; font-size:calc(var(--u)*5.4); letter-spacing:-.02em; line-height:1.05; }

.caption{ position:absolute; left:calc(var(--u)*3.5); top:calc(var(--u)*3); max-width:min(46%, 30em); pointer-events:none;
  padding:calc(var(--u)*1.5) calc(var(--u)*2.2); border-radius:calc(var(--u)*1.6); font-size:calc(var(--u)*2.1); font-weight:700; line-height:1.25; }
.caption > span{ display:block; }

.counter{ position:absolute; left:calc(var(--u)*3.5); bottom:calc(var(--u)*3.5 + 26px); transform-origin:left center; padding:.35em 1em; border-radius:99px;
  font-size:calc(var(--u)*2.2); font-weight:700; font-variant-numeric:tabular-nums; pointer-events:none; }
.counter .num{ display:inline-block; min-width:2.3em; text-align:right; }

.card{ position:absolute; right:calc(var(--u)*3); top:calc(var(--u)*3 + 50px); width:21em; padding:calc(var(--u)*1.4) calc(var(--u)*1.8);
  border-radius:calc(var(--u)*1.8); font-size:calc(var(--u)*1.5); }
.blk + .blk{ margin-top:calc(var(--u)*1.4); padding-top:calc(var(--u)*1.4); border-top:1px solid var(--stroke); }
.blk h2{ margin:0 0 .45em; font-size:1em; font-weight:800; display:flex; align-items:center; gap:.5em; }
.blk h2 i{ width:.8em; height:.8em; border-radius:50%; display:inline-block; }
.data{ display:flex; gap:.3em 1.3em; flex-wrap:wrap; font-size:1.05em; }
.data > div{ white-space:nowrap; }
.eq{ overflow:hidden; }
.sys{ margin-top:.55em; border-left:2px solid var(--muted); border-radius:12px 0 0 12px; padding:.1em 0 .1em .7em; display:grid; gap:.12em; font-size:1.12em; }
.live{ margin-top:.5em; font-size:.92em; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
.live b{ color:var(--ink); font-weight:800; }
.live .num{ display:inline-block; min-width:2.55em; text-align:right; }

.question{ position:absolute; left:calc(var(--u)*3.5); bottom:calc(var(--u)*3.5 + 84px); pointer-events:none;
  padding:calc(var(--u)*2.4) calc(var(--u)*3); border-radius:calc(var(--u)*2.2); width:calc(var(--u)*42); }
.question h2{ margin:0; font-size:calc(var(--u)*3); font-weight:800; line-height:1.15; letter-spacing:-.015em; }
.question .calc{ margin-top:calc(var(--u)*1.3); display:grid; gap:.45em; font-size:calc(var(--u)*1.55); font-weight:600; font-variant-numeric:tabular-nums; }
.question .calc div{ display:flex; align-items:center; gap:.5em; white-space:nowrap; }
.question .calc i{ width:.7em; height:.7em; border-radius:50%; display:inline-block; flex:none; }
.question .calc b{ color:var(--t); font-weight:800; }
.live.hit b{ color:var(--t); }

.ctrl{ position:absolute; right:calc(var(--u)*3); top:calc(var(--u)*3); display:flex; gap:8px; }
.ctrl button{ font:inherit; font-weight:700; font-size:14px; padding:9px 15px; border-radius:99px; color:var(--ink); cursor:pointer; }
.ctrl button:focus-visible{ outline:3px solid var(--Bl); outline-offset:2px; }
.seek{ position:absolute; left:0; right:0; bottom:0; padding:28px calc(var(--u)*3) calc(var(--u)*1.2) calc(var(--u)*3.5); display:flex; align-items:center; gap:14px; transition:opacity .25s; }
.seek input{ flex:1; accent-color:var(--t); height:22px; cursor:pointer; }
.seek span{ font-size:14px; font-weight:700; color:#3b4250; font-variant-numeric:tabular-nums; min-width:6.5em; text-align:right; text-shadow:0 0 6px #fff; }
@media (hover: hover){ .seek{ opacity:0; } .seek:hover, .seek:has(input:focus-visible), .seek.drag{ opacity:1; } }

@media (max-aspect-ratio: 1/1){
  .stage{ --u:min(1.9vw, 1.2vh); }
  .card{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); width:auto; top:calc(var(--u)*2.5); font-size:calc(var(--u)*1.55); padding:calc(var(--u)*1.2) calc(var(--u)*1.6); }
  .blk + .blk{ margin-top:calc(var(--u)*1); padding-top:calc(var(--u)*1); }
  .counter{ left:auto; right:calc(var(--u)*4); top:calc(var(--u)*3.5); bottom:auto; font-size:calc(var(--u)*1.9); transform-origin:right center; }
  .ctrl{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); top:auto; bottom:calc(var(--u)*2 + 36px); flex-wrap:wrap; gap:6px; }
  .ctrl button{ padding:7px 11px; font-size:13px; }
  .caption{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); max-width:none; top:auto; bottom:calc(var(--u)*2 + 128px); font-size:calc(var(--u)*2.5); }
  .question{ left:calc(var(--u)*2.5); right:calc(var(--u)*2.5); width:auto; bottom:calc(var(--u)*2 + 128px); }
  .question h2{ font-size:calc(var(--u)*3.2); }
  .question .calc{ font-size:calc(var(--u)*1.6); }
  .seek{ padding:10px calc(var(--u)*3) calc(var(--u)*2); }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c" aria-label="Animation 3D : deux drones se déplacent en ligne droite dans un hangar"></canvas>
  <div id="labels"></div>
  <div class="title" id="title"><div class="box glass"><p>Partie 3</p><h1>Application</h1></div></div>

  <div class="card glass" id="card" style="opacity:0">
    <div class="blk" id="blkR">
      <h2><i style="background:var(--R)"></i>Drone rouge</h2>
      <div class="data"><div id="dA"><span class="m cR">A</span><span class="cR">(1 ; 1 ; 1)</span></div><div id="du"><span class="m cRv vec">u</span> = <span class="cRv">(2 ; 1 ; 0,5)</span></div></div>
      <div class="eq" id="eqR"><div class="sys">
        <div id="R0"><span class="m">x</span> = <span class="cR">1</span> + <span class="cRv">2</span><span class="m ct">t</span></div>
        <div id="R1"><span class="m">y</span> = <span class="cR">1</span> + <span class="m ct">t</span></div>
        <div id="R2"><span class="m">z</span> = <span class="cR">1</span> + <span class="cRv">0,5</span><span class="m ct">t</span></div>
      </div></div>
      <div class="live" id="liveR">&nbsp;</div>
    </div>
    <div class="blk" id="blkB">
      <h2><i style="background:var(--Bl)"></i>Drone bleu</h2>
      <div class="data"><div id="dB"><span class="m cB">B</span><span class="cB">(7 ; −1 ; 3)</span></div><div id="dv"><span class="m cBv vec">v</span> = <span class="cBv">(−1 ; 2 ; −0,5)</span></div></div>
      <div class="eq" id="eqB"><div class="sys">
        <div id="B0"><span class="m">x</span> = <span class="cB">7</span> − <span class="m ct">t</span></div>
        <div id="B1"><span class="m">y</span> = <span class="cB">−1</span> + <span class="cBv">2</span><span class="m ct">t</span></div>
        <div id="B2"><span class="m">z</span> = <span class="cB">3</span> − <span class="cBv">0,5</span><span class="m ct">t</span></div>
      </div></div>
      <div class="live" id="liveB">&nbsp;</div>
    </div>
  </div>

  <div class="counter glass" id="counter" style="opacity:0"><span class="m ct">t</span> = <span class="num" id="tnum">0,0</span> s</div>
  <div class="caption glass" id="caption" style="opacity:0"><span id="captxt"></span></div>

  <div class="ctrl"><button class="glass" id="rot" aria-pressed="true">Rotation auto : oui</button><button class="glass" id="voice" aria-pressed="false">Activer la voix</button><button class="glass" id="sound" aria-pressed="false">Activer le son</button><button class="glass" id="pause">Pause</button><button class="glass" id="replay">Rejouer</button></div>
  <div class="seek"><input type="range" id="seek" min="0" max="65" step="0.1" value="0" aria-label="Position dans l'animation"><span id="clock">0:00 / 1:05</span></div>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="lib/RoomEnvironment.js"></script>
<script>
(function(){
  const REC = /[?&]record/.test(location.search);
  // ---------- outils ----------
  const M = (x,y,z) => new THREE.Vector3(x, z, -y);
  const Mv = a => M(a[0],a[1],a[2]);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  const sine = x => -(Math.cos(Math.PI*x)-1)/2;
  const back = x => { const c=1.7, c3=c+1; return 1 + c3*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
  const num = (n, d) => '<span class="num">' + (Math.abs(n) < 0.005 ? 0 : n).toFixed(d === undefined ? 2 : d).replace('.', ',').replace('-', '−') + '</span>';
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  // ---------- données ----------
  const A = [1,1,1], U = [2,1,0.5], B = [7,-1,3], V = [-1,2,-0.5];
  const red = t => [A[0]+t*U[0], A[1]+t*U[1], A[2]+t*U[2]];
  const blue = t => [B[0]+t*V[0], B[1]+t*V[1], B[2]+t*V[2]];

  // ---------- scénario (secondes) ----------
  const K = { axes:4.5, redIn:8, uIn:11.5, redPrev:15, redEq:[19.5,21,22.5], blueIn:25, vIn:28.5, bluePrev:32, blueEq:[36.5,38,39.5],
              ready:41, go:43, sec:4.5 };
  const HIT = K.go + 2*K.sec, END = HIT + 13;
  const flightT = T => T < K.go ? 0 : Math.min(2, (T - K.go)/K.sec);
  const V_ = '<span class="m vec">', caps = [
    [0.5, ""],
    [4.8, "Un repère dans le hangar\u00a0: les axes <span class=\"m\">x</span>, <span class=\"m\">y</span> et <span class=\"m\">z</span>."],
    [8, "Un drone rouge est en vol stationnaire au point <span style=\"white-space:nowrap\"><span class=\"m\">A</span>(1 ; 1 ; 1)</span>."],
    [11.5, "Il va se déplacer dans la direction du vecteur <span style=\"white-space:nowrap\">" + V_ + "u</span> = (2 ; 1 ; 0,5)</span>."],
    [15, "Sa trajectoire\u00a0: une ligne droite qui part de <span class=\"m\">A</span> dans la direction de " + V_ + "u</span>."],
    [19.5, "Sa position à l’instant <span class=\"m\">t</span> est donnée par ses équations paramétriques."],
    [25, "Un drone bleu est en vol stationnaire au point <span style=\"white-space:nowrap\"><span class=\"m\">B</span>(7 ; −1 ; 3)</span>."],
    [28.5, "Il se dirige selon le vecteur <span style=\"white-space:nowrap\">" + V_ + "v</span> = (−1 ; 2 ; −0,5)</span>."],
    [32, "Sa trajectoire est, elle aussi, une ligne droite."],
    [36.5, "Voici ses équations paramétriques."],
    [K.ready, "Les deux drones démarrent en même temps. Ici, <span class=\"m\">t</span> est le temps en secondes."],
    [K.go + 1.05*K.sec, "À chaque instant <span class=\"m\">t</span>, les équations donnent la position de chaque drone."],
    [HIT - 2.6, "Grâce aux équations, on peut savoir à l’avance s’ils vont se toucher…"],
    [HIT + 0.35, "À <span class=\"m\">t</span> = 2 s, les deux drones sont au même point <span style=\"white-space:nowrap\"><span class=\"m\">P</span>(5 ; 3 ; 2)</span>\u00a0: collision\u00a0!"],
    [HIT + 6, "Même point, au même instant <span class=\"m\">t</span>\u00a0: les équations paramétriques permettent de prévoir la collision."]
  ];

  // ---------- rendu ----------
  const stage = $('stage'), canvas = $('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:REC});
  renderer.setPixelRatio(REC ? 1 : Math.min(window.devicePixelRatio||1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.72;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#e7ebef');
  scene.fog = new THREE.Fog('#e3e7eb', 30, 70);
  const camera = new THREE.PerspectiveCamera(34, 16/9, 0.1, 200);
  const target = M(4, 1.5, 1.6);

  // lumières + reflets d'environnement
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a939d, 0.3));
  const sun = new THREE.DirectionalLight(0xfff6ea, 1.25);
  sun.position.copy(target).add(new THREE.Vector3(-5, 18, 7)); sun.target.position.copy(target); scene.add(sun, sun.target);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 5;
  Object.assign(sun.shadow.camera, {left:-14, right:14, top:14, bottom:-14, near:1, far:45});

  // ---------- hangar ----------
  const H = new THREE.Group(); scene.add(H);
  const C0 = target.clone().setY(0);
  const W = 40, HH = 12;
  const std = (color, rough, extra) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:rough ?? .8, metalness:0}, extra||{}));
  const rnd = (() => { let x = 1234567; return () => ((x = (x*16807) % 2147483647) / 2147483647); })();
  function canvasTex(w, h, draw, rep, srgb){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (rep) t.repeat.set(rep[0], rep[1]); if (srgb) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 8; return t; }
  // sol en béton poli : une dalle de 4 m par répétition
  const floorMap = canvasTex(1024, 1024, (x, w, h) => {
    x.fillStyle = '#a9aeb4'; x.fillRect(0,0,w,h);
    for (let i=0;i<60;i++){ const r = 60 + rnd()*220, cx = rnd()*w, cy = rnd()*h, g = x.createRadialGradient(cx,cy,0,cx,cy,r), d = rnd() < .5;
      g.addColorStop(0, d ? 'rgba(120,126,134,.07)' : 'rgba(225,229,233,.06)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); }
    for (let i=0;i<26000;i++){ const v = 150 + rnd()*90|0; x.fillStyle = `rgba(${v},${v+2},${v+5},.28)`; x.fillRect(rnd()*w, rnd()*h, 1.6, 1.6); }
    for (let i=0;i<5;i++){ x.strokeStyle = 'rgba(90,96,104,.10)'; x.lineWidth = 10 + rnd()*14; x.beginPath(); const y0 = rnd()*h; x.moveTo(0, y0);
      x.bezierCurveTo(w*.3, y0 + (rnd()-.5)*300, w*.7, y0 + (rnd()-.5)*300, w, y0 + (rnd()-.5)*200); x.stroke(); }
    x.fillStyle = 'rgba(70,76,84,.55)'; x.fillRect(0,0,w,4); x.fillRect(0,0,4,h);
  }, [W/4, W/4], true);
  const floorRough = canvasTex(512, 512, (x, w, h) => { x.fillStyle = '#6a6a6a'; x.fillRect(0,0,w,h);
    for (let i=0;i<40;i++){ const r = 30 + rnd()*120, cx = rnd()*w, cy = rnd()*h, g = x.createRadialGradient(cx,cy,0,cx,cy,r);
      const v = rnd() < .5 ? 40 : 170; g.addColorStop(0, `rgba(${v},${v},${v},.5)`); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0,0,w,h); } }, [W/4, W/4]);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, W), new THREE.MeshStandardMaterial({map:floorMap, roughnessMap:floorRough, roughness:.75, metalness:0, envMapIntensity:.55}));
  floor.rotation.x = -Math.PI/2; floor.position.copy(C0); floor.receiveShadow = true; H.add(floor);
  // marquage de sécurité (zone de vol)
  const yel = new THREE.MeshStandardMaterial({color:'#e2b21a', roughness:.55});
  function stripe(x0,y0,x1,y1,wd){ const a = M(x0,y0,0), b = M(x1,y1,0), len = a.distanceTo(b);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, wd || 0.12), yel); m.rotation.x = -Math.PI/2; m.position.copy(a).lerp(b,.5).setY(0.004);
    m.rotation.z = -Math.atan2(b.z-a.z, b.x-a.x); m.receiveShadow = true; H.add(m); }
  stripe(-3,-4,11,-4); stripe(11,-4,11,8); stripe(11,8,-3,8); stripe(-3,8,-3,-4);
  // murs en bardage métallique ondulé
  const ribColor = canvasTex(256, 64, (x, w, h) => { for (let i=0;i<w;i++){ const s = Math.sin(i/w*Math.PI*2*8); const v = 214 + s*14|0; x.fillStyle = `rgb(${v},${v+4},${v+8})`; x.fillRect(i,0,1,h); } }, [W/2, 5], true);
  const ribNormal = canvasTex(256, 64, (x, w, h) => { for (let i=0;i<w;i++){ const d = Math.cos(i/w*Math.PI*2*8); const nx = 128 + d*90|0; x.fillStyle = `rgb(${nx},128,255)`; x.fillRect(i,0,1,h); } }, [W/2, 5]);
  const wallMat = new THREE.MeshStandardMaterial({envMapIntensity:.6, color:'#d6dbe0', map:ribColor, normalMap:ribNormal, normalScale:new THREE.Vector2(.9,.9), metalness:.55, roughness:.42});
  const plinthMat = new THREE.MeshStandardMaterial({color:'#a9afb6', roughness:.9, map:floorMap});
  const glassMat = new THREE.MeshStandardMaterial({color:'#eef6ff', emissive:'#eef6ff', emissiveIntensity:.9, roughness:.2});

    AU.bedF.frequency.setTargetAtTime(T > K.go ? 260 + 500*clamp((T-K.go)/(HIT-K.go)) : 240, now, .3);
  }
  function masterTo(v){ if (!AU.ctx) return; const t = AU.ctx.currentTime; AU.master.gain.cancelScheduledValues(t); AU.master.gain.setTargetAtTime(v, t, 0.15); }


  // ---------- voix off (synthèse vocale du navigateur, idéale avec Edge) ----------
  const VOICE = [
    [0.4,  "Partie trois. Application."],
    [4.8,  "Un repère dans le hangar : les axes x, y et z."],
    [8,    "Un drone rouge est en vol stationnaire au point A, de coordonnées un, un, un."],
    [11.5, "Il va se déplacer dans la direction du vecteur u, de composantes deux, un, zéro virgule cinq."],
    [15,   "Sa trajectoire : une ligne droite qui part de A, dans la direction de u."],
    [19.5, "Sa position à l'instant t est donnée par ses équations paramétriques : x égal un plus deux t, y égal un plus t, z égal un plus zéro virgule cinq t."],
    [25,   "Un drone bleu est en vol stationnaire au point B, de coordonnées sept, moins un, trois."],
    [28.5, "Il se dirige selon le vecteur v, de composantes moins un, deux, moins zéro virgule cinq."],
    [32,   "Sa trajectoire est, elle aussi, une ligne droite."],
    [36.5, "Voici ses équations paramétriques : x égal sept moins t, y égal moins un plus deux t, z égal trois moins zéro virgule cinq t."],
    [41,   "Les deux drones démarrent en même temps."],
    [45.3, "t est le temps en secondes. À chaque instant, les équations donnent la position de chaque drone."],
    [HIT - 0.05, "Collision ! À t égal deux secondes, les deux drones sont au même point P, de coordonnées cinq, trois, deux."],
    [HIT + 6, "Même point, au même instant : les équations paramétriques permettaient de prévoir la collision."]
  ];
  const VO = { on:false, busy:false, until:0, voice:null, supported: 'speechSynthesis' in window };
  function pickVoice(){ if (!VO.supported) return; const vs = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); if (!vs.length) return;
    const score = v => (/natural|online|neural/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) + (/fr-CH/i.test(v.lang) ? 2 : 0) + (/fr-FR/i.test(v.lang) ? 1 : 0) + (v.localService ? 0 : 1);
    VO.voice = vs.sort((a,b) => score(b) - score(a))[0]; }
  if (VO.supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text){ if (!VO.supported) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
    u.lang = VO.voice ? VO.voice.lang : 'fr-FR'; if (VO.voice) u.voice = VO.voice; u.rate = 0.97; u.pitch = 1;
    u.onstart = () => { VO.busy = true; if (AU.on) masterTo(0.45); };
    u.onend = u.onerror = () => { VO.busy = false; if (AU.on && playing) masterTo(0.9); };
    VO.busy = true; VO.until = performance.now() + (text.length*0.085/0.97 + 2)*1000; speechSynthesis.speak(u); }
  function hush(){ if (VO.supported) speechSynthesis.cancel(); VO.busy = false; }
  function voiceTick(a, b){ if (!VO.on || b <= a) return; for (const [tm, txt] of VOICE){ if (tm > a && tm <= b) say(txt); } }
  // tant que la voix parle, l'animation attend avant l'étape parlée suivante
  function holdForVoice(prev, next){ if (!VO.on || !VO.busy || performance.now() > VO.until) return next; for (const [tm] of VOICE){ if (tm > prev && tm <= next) return Math.max(prev, tm - 0.001); } return next; }
  // ---------- commandes ----------
  let T = 0, playing = true, last = performance.now();
  const pauseBtn = $('pause'), replayBtn = $('replay'), soundBtn = $('sound'), rotBtn = $('rot'), seekEl = $('seek'), clockEl = $('clock');
  function setRotBtn(){ rotBtn.textContent = 'Rotation auto : ' + (ROT.on ? 'oui' : 'non'); rotBtn.setAttribute('aria-pressed', ROT.on); }
  pauseBtn.addEventListener('click', () => { if (T >= END){ T = 0; playing = true; hush(); } else playing = !playing; pauseBtn.textContent = playing ? 'Pause' : 'Lecture'; if (VO.supported){ if (playing) speechSynthesis.resume(); else speechSynthesis.pause(); } if (AU.on) masterTo(playing ? 0.9 : 0); });
  replayBtn.addEventListener('click', () => { hush(); AU.nextAlarm = 0; T = -0.001; playing = true; userMoved = false; ROT.on = true; ROT.clock = 0; ROT.az = 0; ROT.el = ROT.r = null; setRotBtn(); pauseBtn.textContent = 'Pause'; if (AU.on) masterTo(0.9); });
  rotBtn.addEventListener('click', () => {
    if (ROT.on){ ROT.on = false; userMoved = true; }
    else { const d = camera.position.clone().sub(controls.target), r = d.length(), intro = 1 - ease(clamp(T/6));
      ROT.r = r; ROT.el = Math.asin(d.y/r);
      ROT.az = Math.atan2(d.x, d.z) - (baseAz - 0.6*intro + (reduce ? 0 : (ROT.clock - 47)*2*Math.PI/300));
      userMoved = false; ROT.on = true; }
    setRotBtn(); });
  soundBtn.addEventListener('click', () => { if (!AU.ctx) auInit(); AU.ctx.resume(); AU.on = !AU.on;
    soundBtn.textContent = AU.on ? 'Couper le son' : 'Activer le son'; soundBtn.setAttribute('aria-pressed', AU.on);
    masterTo(AU.on && playing ? 0.9 : 0); AU.nextAlarm = T; });
  seekEl.max = END;
  let skipAudio = false, dragging = false;
  const mmss = x => { x = Math.max(0, Math.round(x)); return Math.floor(x/60) + ':' + String(x%60).padStart(2,'0'); };
  function jump(sec){ T = Math.max(0, Math.min(END, sec)); skipAudio = true; hush(); if (T >= END){ playing = false; pauseBtn.textContent = 'Lecture'; } AU.nextAlarm = T; }
  const seekBox = seekEl.parentElement;
  seekEl.addEventListener('pointerdown', () => { dragging = true; seekBox.classList.add('drag'); });
  window.addEventListener('pointerup', () => { if (dragging) seekEl.blur(); dragging = false; seekBox.classList.remove('drag'); });
  seekEl.addEventListener('input', () => jump(parseFloat(seekEl.value)));
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.target === seekEl && e.key.startsWith('Arrow')) return;
    if (e.key === ' '){ e.preventDefault(); pauseBtn.click(); }
    else if (e.key === 'ArrowLeft') jump(T - 5); else if (e.key === 'ArrowRight') jump(T + 5); });

  const voiceBtn = $('voice');
  voiceBtn.addEventListener('click', () => {
    if (!VO.supported){ voiceBtn.textContent = 'Voix indisponible'; return; }
    VO.on = !VO.on; voiceBtn.textContent = VO.on ? 'Couper la voix' : 'Activer la voix'; voiceBtn.setAttribute('aria-pressed', VO.on);
    if (!VO.on){ hush(); if (AU.on && playing) masterTo(0.9); return; }
    pickVoice();
    if (T < 0.4){ say(VOICE[0][1]); T = 0.401; }
    else { let cur = null; for (const v of VOICE){ if (v[0] <= T) cur = v; } if (cur && T - cur[0] < 3) say(cur[1]); }
  });
  function loop(now){
    const dt = Math.min(0.1, (now-last)/1000); last = now;
    const prevT = T;
    if (ROT.on) ROT.clock += dt;
    if (playing){ T = holdForVoice(prevT, Math.min(END, T + dt)); if (T >= END){ playing = false; pauseBtn.textContent = 'Lecture'; } }
    if (skipAudio) skipAudio = false; else { audioTick(prevT, T); voiceTick(prevT, T); }
    audioFrame(T);
    if (!dragging) seekEl.value = T.toFixed(1);
    clockEl.textContent = mmss(T) + ' / ' + mmss(END);
    renderAt(Math.max(0, T));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
