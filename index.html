fd28a');\n    x.fillStyle = g; x.fillRect(0,0,16,512); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; })();\n  const skyM = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), new THREE.MeshBasicMaterial({map:sky, side:THREE.BackSide, fog:false}));\n  scene.add(skyM);\n  scene.fog = new THREE.Fog('#c46a62', 50, 240);\n\n  // ---------- mat\u00e9riaux cel-shading ----------\n  const grad = (() => { const d = new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 255, 255, 255, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat);\n    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; })();\n  const toon = (color, extra) => new THREE.MeshToonMaterial(Object.assign({color, gradientMap:grad}, extra||{}));\n  const lineMat = new THREE.MeshBasicMaterial({color:'#17111f', side:THREE.BackSide});\n  function part(parent, geo, mat, pos, opts){ opts = opts || {};\n    const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(pos[0], pos[1], pos[2]);\n    if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]); if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);\n    m.castShadow = true; parent.add(m);\n    if (opts.line !== false){ const o = new THREE.Mesh(geo, lineMat); o.scale.setScalar(opts.line || 1.07); m.add(o); }\n    return m; }\n  function limb(parent, len, r0, r1, mat, pos){ const g = new THREE.Group(); if (pos) g.position.set(pos[0], pos[1], pos[2]); parent.add(g);\n    const geo = new THREE.CylinderGeometry(r1, r0, len, 16); geo.translate(0, -len/2, 0);\n    part(g, geo, mat, null, {line:1.08}); part(g, new THREE.SphereGeometry(r0*1.02, 16, 12), mat, [0,0,0], {line:1.08}); return g; }\n\n  // ---------- le guerrier (design original) ----------\n  function buildHero(){\n    const skin = toon('#f1c8a4'), suit = toon('#1f2330'), vest = toon('#c9322f'), gold = toon('#f2b43a'), white = toon('#f4f4f6'), hairM = toon('#e9eef6'), tip = toon('#3fd0c9'), boot = toon('#3a2a22');\n    const root = new THREE.Group(), pelvis = new THREE.Group(); pelvis.position.y = .98; root.add(pelvis);\n    part(pelvis, new THREE.SphereGeometry(.2, 20, 14), suit, [0,0,0], {scale:[1.1,.8,.85]});\n    const torso = new THREE.Group(); pelvis.add(torso);\n    part(torso, new THREE.CylinderGeometry(.24, .19, .5, 20), vest, [0,.3,0], {scale:[1,1,.78]});\n    part(torso, new THREE.SphereGeometry(.24, 20, 14, 0, Math.PI*2, 0, Math.PI/2), vest, [0,.55,0], {scale:[1.05,.55,.8]});\n    part(torso, new THREE.TorusGeometry(.2, .035, 10, 28), gold, [0,.07,0], {rot:[Math.PI/2,0,0], scale:[1,.82,1]});\n    part(torso, new THREE.BoxGeometry(.08, .34, .02), suit, [0,.33,.15], {line:1.15});\n    const neck = part(torso, new THREE.CylinderGeometry(.07, .08, .1, 12), skin, [0,.66,0]);\n    const head = new THREE.Group(); head.position.y = .82; torso.add(head);\n    part(head, new THREE.SphereGeometry(.16, 24, 18), skin, [0,0,0], {scale:[.95,1.08,1]});\n    part(head, new THREE.SphereGeometry(.07, 12, 10), skin, [0,-.09,.05], {scale:[1.3,.8,1], line:false});\n    [-1,1].forEach(s => {\n      part(head, new THREE.SphereGeometry(.028, 12, 10), white, [s*.058, .01, .138], {scale:[1,1.25,.5], line:1.2});\n      part(head, new THREE.SphereGeometry(.015, 10, 8), toon('#1d1a2a'), [s*.056, .005, .15], {scale:[1,1.3,.5], line:false});\n      part(head, new THREE.BoxGeometry(.06, .013, .01), toon('#1d1a2a'), [s*.058, .05, .15], {rot:[0,0,s*-.3], line:false});\n      part(head, new THREE.SphereGeometry(.03, 10, 8), skin, [s*.155, 0, 0], {scale:[.5,1,.8]});\n    });\n    part(head, new THREE.BoxGeometry(.05, .008, .01), toon('#7a3b33'), [0,-.075,.148], {line:false});\n    part(head, new THREE.TorusGeometry(.158, .02, 8, 32), white, [0,.06,0], {rot:[Math.PI/2 - .12, 0, 0]});\n    [[-.04, .05], [.05, -.03]].forEach(([dx, dz], i) => part(head, new THREE.BoxGeometry(.03, .3, .012), white, [dx, -.06, -.17], {rot:[.35 + i*.15, 0, dz]}));\n    // cheveux en pointes, balay\u00e9s vers l'arri\u00e8re\n    const spikes = [[0,.14,.06, -.5,0,0,.2],[.08,.12,.02,-.9,0,-.6,.22],[-.08,.12,.02,-.9,0,.6,.22],[0,.1,-.08,-1.9,0,0,.3],[.1,.06,-.06,-2.2,0,-.9,.26],\n      [-.1,.06,-.06,-2.2,0,.9,.26],[.05,.14,-.03,-1.3,0,-.3,.28],[-.05,.14,-.03,-1.3,0,.3,.28],[0,.02,-.13,-2.6,0,0,.24],[.12,-.02,-.02,-2.4,0,-1.3,.18],[-.12,-.02,-.02,-2.4,0,1.3,.18]];\n    spikes.forEach(([x,y,z,rx,ry,rz,h]) => { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.set(rx, ry, rz); head.add(g);\n      const c = new THREE.ConeGeometry(.075, h, 8); c.translate(0, h/2, 0); part(g, c, hairM, [0,0,0], {line:1.1});\n      const t2 = new THREE.ConeGeometry(.033, h*.35, 8); t2.translate(0, h*.175, 0); part(g, t2, tip, [0, h*.66, 0], {line:false}); });\n    const arms = [-1,1].map(s => { const sh = limb(torso, .3, .075, .065, suit, [s*.29,.55,0]);\n      part(sh, new THREE.SphereGeometry(.11, 14, 10), vest, [s*.02,.02,0], {scale:[1.1,.8,1]});\n      const el = limb(sh, .27, .06, .05, skin, [0,-.3,0]); el.position.y = -.3;\n      part(el, new THREE.TorusGeometry(.058, .026, 8, 20), gold, [0,-.2,0], {rot:[Math.PI/2,0,0]});\n      const hand = part(el, new THREE.SphereGeometry(.06, 14, 10), skin, [0,-.31,0], {scale:[.85,1.1,.6]}); return {sh, el, hand}; });\n    const legs = [-1,1].map(s => { const hip = limb(pelvis, .45, .1, .08, suit, [s*.11,-.05,0]);\n      const kn = limb(hip, .43, .075, .06, suit, [0,-.45,0]);\n      part(kn, new THREE.CylinderGeometry(.085, .07, .2, 14), boot, [0,-.34,0]);\n      part(kn, new THREE.BoxGeometry(.13, .08, .26), boot, [0,-.45,.05]); return {hip, kn}; });\n    return {root, pelvis, torso, head, arms, legs};\n  }\n\n  // ---------- l'adversaire (design original) ----------\n  function buildRival(){\n    const armor = toon('#2b2f3d'), plate = toon('#454b5e'), skin = toon('#7b8a9a'), glow = new THREE.MeshBasicMaterial({color:'#62ff8a'}), capeM = toon('#5b1830', {side:THREE.DoubleSide}), horn = toon('#d9d2c2');\n    const root = new THREE.Group(), pelvis = new THREE.Group(); pelvis.position.y = 1.05; root.add(pelvis);\n    part(pelvis, new THREE.SphereGeometry(.21, 20, 14), armor, [0,0,0], {scale:[1.05,.8,.85]});\n    const torso = new THREE.Group(); pelvis.add(torso);\n    part(torso, new THREE.CylinderGeometry(.27, .18, .56, 6), plate, [0,.32,0], {scale:[1,1,.75]});\n    part(torso, new THREE.BoxGeometry(.3, .03, .02), glow, [0,.4,.19], {line:false}); part(torso, new THREE.BoxGeometry(.03, .28, .02), glow, [0,.26,.17], {line:false});\n    [-1,1].forEach(s => { const sp = part(torso, new THREE.ConeGeometry(.13, .3, 5), plate, [s*.32,.62,0], {rot:[0,0,-s*.9]}); });\n    const head = new THREE.Group(); head.position.y = .82; torso.add(head);\n    part(head, new THREE.SphereGeometry(.15, 20, 16), armor, [0,0,0], {scale:[.92,1.12,1]});\n    part(head, new THREE.BoxGeometry(.2, .05, .06), armor, [0,-.02,.12], {line:1.15});\n    [-1,1].forEach(s => { part(head, new THREE.BoxGeometry(.055, .014, .01), glow, [s*.05,.02,.152], {rot:[0,0,s*.35], line:false});\n      const h = new THREE.Group(); h.position.set(s*.1,.1,0); h.rotation.z = -s*.5; head.add(h);\n      const c1 = new THREE.ConeGeometry(.045, .28, 8); c1.translate(0,.14,0); const m1 = part(h, c1, horn, [0,0,0], {line:1.12}); m1.rotation.x = -.5; });\n    // cape\n    const cg = new THREE.PlaneGeometry(.8, 1.5, 8, 14); cg.translate(0, -.75, 0);\n    const cape = part(torso, cg, capeM, [0,.62,-.2], {line:false}); cape.userData.base = cg.attributes.position.array.slice();\n    const arms = [-1,1].map(s => { const sh = limb(torso, .32, .08, .07, armor, [s*.31,.55,0]);\n      const el = limb(sh, .28, .065, .055, skin, [0,-.32,0]); el.position.y = -.32;\n      part(el, new THREE.CylinderGeometry(.075, .07, .14, 6), plate, [0,-.16,0]);\n      const hand = part(el, new THREE.SphereGeometry(.058, 14, 10), skin, [0,-.31,0], {scale:[.85,1.1,.6]}); return {sh, el, hand}; });\n    const legs = [-1,1].map(s => { const hip = limb(pelvis, .46, .
